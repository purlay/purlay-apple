# The Mac app's release: a `macos/vX.Y.Z` tag on a commit that already passed CI on main becomes a signed, notarized, stapled app,
# a signed Sparkle appcast, a GitHub release and, once the stable feed is live, the feed itself. The tests are not run again: the
# gate refuses a commit whose CI run on main did not succeed. Run it by hand with `publish` off to rehearse everything but the
# publication. Runbook: docs/runbooks/release-macos.md.
name: Release macOS
on:
  push:
    tags: ["macos/v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release (only from a macos/v* tag). Off: a rehearsal that signs and notarizes, and publishes nothing."
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PURLAY_CACHE_DIR: ${{ github.workspace }}/.cache/compilation
  # A release ships within 10 minutes; scripts/verify writes its phases against this to the run's summary.
  PURLAY_TARGET_SECONDS: 600

jobs:
  # The tag names the configured version, the changelog has its entry, and the commit passed CI on main.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.gate.outputs.version }}
      publish: ${{ steps.mode.outputs.publish }}
      feed: ${{ steps.feed.outputs.feed }}
      pages_path: ${{ steps.feed.outputs.pages_path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: mode
        name: Publish, or rehearse
        run: |
          case "$EVENT:$PUBLISH:$GITHUB_REF" in
            push:*:refs/tags/macos/v*) publish=true ;;
            workflow_dispatch:true:refs/tags/macos/v*) publish=true ;;
            workflow_dispatch:true:*) echo "FAIL: publishing needs a macos/v* tag; run it from the tag, or turn publish off" >&2; exit 1 ;;
            *) publish=false ;;
          esac
          echo "publish=$publish" | tee -a "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          PUBLISH: ${{ inputs.publish }}
      - id: gate
        name: The version, the changelog, and CI on main
        run: scripts/ci/release-gate macos
        env:
          DRY_RUN: ${{ steps.mode.outputs.publish != 'true' }}
          GH_TOKEN: ${{ github.token }}
      - id: feed
        name: Where installed Macs read their updates
        run: |
          feed="$(scripts/ci/feed-url)"
          if grep -qx 'pages_path=' <<<"$feed"; then
            echo "::warning title=Installed Macs will not see this release::Config/macOS.xcconfig still names a GitHub releases feed; until the stable feed is live (docs/runbooks/mac-update-feed.md), only a manual download reaches them"
          fi

  # Build from the warm cache, sign, notarize, staple, and sign the appcast. The signing secrets exist only in the `release`
  # environment, whose reviewer approves each run. This job cannot write to the repository.
  build:
    needs: gate
    runs-on: xcode-27
    timeout-minutes: 40
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      TAG: macos/v${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build number is the commit count.
          fetch-depth: 0
          persist-credentials: false
      - name: Xcode, as .github/toolchain.env names it
        run: scripts/ci/select-xcode
      - id: keys
        run: scripts/ci/cache-keys macos
      # Main's macos lane builds Release and saves the cache; a release only reads it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PURLAY_CACHE_DIR }}
          key: ${{ steps.keys.outputs.key }}
          restore-keys: |
            ${{ steps.keys.outputs.this_week }}
            ${{ steps.keys.outputs.last_week }}
      # scripts/verify numbers the build first (scripts/build-number: the commit count, above the shipped build 10).
      - name: Build Release, and check its transport security and entitlements
        run: scripts/ci/retry-infra scripts/verify macos Release
      - name: Find what was built
        run: |
          products="$(xcodebuild -project Apps/Purlay.xcodeproj -scheme Purlay-macOS -configuration Release -showBuildSettings 2>/dev/null \
            | awk -F' = ' '/ BUILT_PRODUCTS_DIR /{print $2; exit}')"
          app="$products/Purlay.app"
          sparkle="$(cd "$products/../../.." && pwd)/SourcePackages/artifacts/sparkle/Sparkle/bin"
          [ -d "$app" ] && [ -x "$sparkle/generate_appcast" ] || { echo "FAIL: no $app or no Sparkle tools in $sparkle" >&2; exit 1; }
          built="$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")"
          [ "$built" = "$VERSION" ] || { echo "FAIL: the app says $built, the tag $VERSION" >&2; exit 1; }
          scripts/ci/feed-url "$app"
          { echo "APP=$app"; echo "SPARKLE_BIN=$sparkle"; } >> "$GITHUB_ENV"
      - name: Import the Developer ID certificate into a keychain of this run
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          [ -n "$CERTIFICATE" ] && [ -n "$CERTIFICATE_PASSWORD" ] || { echo "FAIL: the release environment has no certificate secrets" >&2; exit 1; }
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(openssl rand -base64 32)"
          echo "::add-mask::$password"
          (umask 077 && printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12")
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -x -T /usr/bin/codesign -t cert -f pkcs12 -k "$keychain"
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          [ -n "$identity" ] || { echo "FAIL: no valid Developer ID Application identity (expired or revoked? docs/runbooks/signing-credentials.md)" >&2; exit 1; }
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Sign with Developer ID, Sparkle's helpers first
        run: |
          scripts/sign-release "$APP" "$SIGNING_IDENTITY"
          [ "$(lipo -archs "$APP/Contents/MacOS/Purlay")" = arm64 ]
      - name: Notarize with the App Store Connect API key, and staple
        env:
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          [ -n "$API_KEY_P8" ] && [ -n "$API_KEY_ID" ] && [ -n "$API_ISSUER_ID" ] \
            || { echo "FAIL: the release environment has no App Store Connect API key secrets" >&2; exit 1; }
          key="$RUNNER_TEMP/AuthKey_$API_KEY_ID.p8"
          (umask 077 && printf '%s' "$API_KEY_P8" | base64 --decode > "$key")
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarization.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarization.zip" --key "$key" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" \
            --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notarization.json"
          rm -f "$key"
          cat "$RUNNER_TEMP/notarization.json"
          [ "$(jq -r .status "$RUNNER_TEMP/notarization.json")" = Accepted ] || {
            echo "FAIL: notarization was not accepted; Apple's log: xcrun notarytool log <id> --key … (docs/runbooks/signing-credentials.md)" >&2; exit 1; }
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/Purlay-$VERSION-macOS-arm64.zip"
          (cd dist && shasum -a 256 ./*.zip > SHA256SUMS)
          scripts/release-notes "$VERSION" dist
      - name: Sign the Sparkle appcast, and check every signature in it
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          [ -n "$SPARKLE_PRIVATE_KEY" ] || { echo "FAIL: the release environment has no SPARKLE_PRIVATE_KEY" >&2; exit 1; }
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_BIN/generate_appcast" --ed-key-file - --maximum-deltas 0 \
            --download-url-prefix "$base" --release-notes-url-prefix "$base" \
            --link "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" dist
          python3 - "$base" <<'PY'
          import os, subprocess, sys, xml.etree.ElementTree as ET
          SPARKLE = "{http://www.andymatuschak.org/xml-namespaces/sparkle}"
          base, version = sys.argv[1], os.environ["VERSION"]
          item = ET.parse("dist/appcast.xml").getroot().find("./channel/item")
          assert item is not None, "the appcast has no item"
          assert item.findtext(f"{SPARKLE}shortVersionString") == version, "the appcast's version is not the tag's"
          enclosure, notes = item.find("enclosure"), item.find(f"{SPARKLE}releaseNotesLink")
          archive, page = f"Purlay-{version}-macOS-arm64.zip", f"Purlay-{version}-macOS-arm64.html"
          assert enclosure is not None and enclosure.get("url") == base + archive, "the archive's address is not the release's"
          assert notes is not None and notes.text == base + page, "the notes' address is not the release's"
          signer = os.path.join(os.environ["SPARKLE_BIN"], "sign_update")
          for arguments in [("dist/appcast.xml",), (f"dist/{archive}", enclosure.get(f"{SPARKLE}edSignature")),
                            (f"dist/{page}", notes.get(f"{SPARKLE}edSignature"))]:
              assert all(arguments), f"no signature for {arguments[0]}"
              subprocess.run([signer, "--ed-key-file", "-", "--verify", *arguments],
                             input=os.environ["SPARKLE_PRIVATE_KEY"].encode(), check=True)
          print("ok  the appcast, the archive and the notes are signed, at the release's addresses")
          PY
      # Before any further action runs: no third-party code runs while the keychain is unlocked.
      - name: Remove the signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/notarization.zip"
          security list-keychains -d user -s "$HOME/Library/Keychains/login.keychain-db"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: purlay-macos-${{ needs.gate.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # Attest where the archive came from, publish the release, and check that what Sparkle will fetch is there.
  publish:
    needs: [gate, build]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      TAG: macos/v${{ needs.gate.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: purlay-macos-${{ needs.gate.outputs.version }}
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Publish the GitHub release
        run: |
          (cd dist && shasum -a 256 -c SHA256SUMS)
          gh release create "$TAG" dist/*.zip dist/SHA256SUMS dist/appcast.xml dist/*.html --repo "$GITHUB_REPOSITORY" \
            --verify-tag --latest --title "Purlay for Mac $VERSION" --notes-file dist/release-notes.md
      - name: What Sparkle fetches is there
        run: |
          for file in appcast.xml "Purlay-$VERSION-macOS-arm64.zip" "Purlay-$VERSION-macOS-arm64.html"; do
            curl --fail --silent --show-error --location --head --retry 3 --output /dev/null \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$file"
            echo "ok  $file"
          done

  # The stable feed: this repository's GitHub Pages site serves the appcast at the address Config/macOS.xcconfig states. Skipped
  # while that address is a GitHub releases one, which the release above already serves.
  feed:
    needs: [gate, publish]
    if: needs.gate.outputs.pages_path != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ needs.gate.outputs.feed }}
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      FEED: ${{ needs.gate.outputs.feed }}
      FEED_PATH: ${{ needs.gate.outputs.pages_path }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: purlay-macos-${{ needs.gate.outputs.version }}
          path: dist
      - name: The site holds the appcast at the feed's path
        run: |
          mkdir -p "site/$(dirname "$FEED_PATH")"
          cp dist/appcast.xml "site/$FEED_PATH"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: The feed offers this version
        run: |
          for _ in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location "$FEED" | grep -q "<sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>"; then
              echo "ok  $FEED offers $VERSION"; exit 0
            fi
            sleep 10
          done
          echo "FAIL: $FEED does not offer $VERSION a minute after the deployment (docs/runbooks/mac-update-feed.md)" >&2
          exit 1

  summary:
    needs: [gate, build, publish, feed]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: The time each step of the release took
        run: scripts/ci/summary 600 "Mac release"
        env:
          GH_TOKEN: ${{ github.token }}
