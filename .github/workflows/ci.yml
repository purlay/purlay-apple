# The check every change passes: the lanes of scripts/verify, side by side, each skipped when the change cannot affect it, and one
# final job, `verify`, which is the only required check. Design and timings: docs/development/ci.md.
name: CI
on:
  pull_request:
    branches: [main]
    # `edited`: the title becomes the squash commit, so a title changed after a green run is judged again.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  # Every night: main builds every lane, the simulator's included, so each day's compilation caches start warm.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  PURLAY_CACHE_DIR: ${{ github.workspace }}/.cache/compilation
  # The target a pull request's run is held to; scripts/verify writes each lane's phases against it to the run's summary.
  PURLAY_TARGET_SECONDS: 180

jobs:
  # Which lanes this change needs (scripts/ci/changes); whether the branch is named as CONTRIBUTING.md asks; whether the title is
  # a conventional commit; and whether each app's version has its changelog section. Every run: each of these is a few seconds.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rules: ${{ steps.lanes.outputs.rules }}
      packages: ${{ steps.lanes.outputs.packages }}
      ios: ${{ steps.lanes.outputs.ios }}
      macos: ${{ steps.lanes.outputs.macos }}
      generated: ${{ steps.lanes.outputs.generated }}
      simulator: ${{ steps.lanes.outputs.simulator }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Each app's version has its changelog section
        run: scripts/ci/changelog-versions
      - name: The branch name
        run: |
          # Dependabot names its own branches; its pull requests are recognised by their author, which a branch name cannot fake.
          if [ "$AUTHOR" = "dependabot[bot]" ]; then echo "Dependabot's branch: $BRANCH"; else scripts/check-branch; fi
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
      - name: The pull request's title is a conventional commit
        if: github.event_name == 'pull_request'
        run: scripts/ci/check-pr-title
        env:
          TITLE: ${{ github.event.pull_request.title }}
      - id: lanes
        name: The lanes this change needs
        run: |
          files=""
          if [ "$EVENT" = pull_request ]; then
            # A list that cannot be read (a diff too large for the API) is empty, and an empty list runs every lane.
            files="$(gh pr diff "$PR" --name-only --repo "$GITHUB_REPOSITORY")" || files=""
          fi
          printf '%s\n' "$files" | scripts/ci/changes "$EVENT" | tee -a "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}

  # The history scanned for secrets. Every run, a documents-only pull request included: a document can carry a secret.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The pinned gitleaks
        run: scripts/ci/retry-infra scripts/install-gitleaks
      - name: No secret in the history
        run: scripts/verify security

  # The tree's rules and their demonstration, and the strings: shell, grep and Python, so Linux and no Swift. The layer rule
  # reads the manifest through SwiftPM and runs in the packages lane on macOS.
  rules:
    needs: changes
    if: needs.changes.outputs.rules == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The pinned actionlint and shellcheck
        run: scripts/ci/retry-infra scripts/install-lint-tools
      - name: The rules
        run: scripts/verify rules
        env:
          # Dependabot's branch is not a topic branch; the changes job recognised it by its author.
          BRANCH: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && 'chore/dependabot' || github.head_ref || github.ref_name }}

  # Format, and every package test on macOS with the Mac screens drawn from state.
  packages:
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: xcode-27
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Xcode, as .github/toolchain.env names it
        run: scripts/ci/select-xcode
      - name: The first xcodebuild, in the background while the caches restore
        run: scripts/ci/warm-xcode start Purlay-macOS
      - uses: ./.github/actions/contract-bundle
        with:
          token: ${{ github.token }}
      - id: keys
        run: scripts/ci/cache-keys packages
      - id: cas
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PURLAY_CACHE_DIR }}
          key: ${{ steps.keys.outputs.key }}
          restore-keys: |
            ${{ steps.keys.outputs.this_week }}
            ${{ github.ref != 'refs/heads/main' && steps.keys.outputs.last_week || '' }}
      - name: The first xcodebuild, finished
        run: scripts/ci/warm-xcode wait
      - name: Format and the package tests
        run: scripts/verify packages
      # Main keeps it; so does a pull request that found nothing at all to restore (main not yet warm, or a new Xcode), so that
      # its next push is warm. GitHub scopes a pull request's cache to that pull request: no other branch can read it.
      - name: Keep the compilation cache
        if: success() && steps.cas.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/main' || steps.cas.outputs.cache-matched-key == '')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PURLAY_CACHE_DIR }}
          key: ${{ steps.keys.outputs.key }}

  # The package and the iOS app, built for the simulator.
  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: xcode-27
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build number is the commit count, so the whole history.
          fetch-depth: 0
          persist-credentials: false
      - name: Xcode, as .github/toolchain.env names it
        run: scripts/ci/select-xcode
      - name: The first xcodebuild, in the background while the caches restore
        run: scripts/ci/warm-xcode start Purlay-iOS
      - id: keys
        run: scripts/ci/cache-keys ios
      - id: cas
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PURLAY_CACHE_DIR }}
          key: ${{ steps.keys.outputs.key }}
          restore-keys: |
            ${{ steps.keys.outputs.this_week }}
            ${{ github.ref != 'refs/heads/main' && steps.keys.outputs.last_week || '' }}
      - name: The first xcodebuild, finished
        run: scripts/ci/warm-xcode wait
      - name: Build for iOS
        run: scripts/verify ios
      # Main keeps it; so does a pull request that found nothing at all to restore (main not yet warm, or a new Xcode), so that
      # its next push is warm. GitHub scopes a pull request's cache to that pull request: no other branch can read it.
      - name: Keep the compilation cache
        if: success() && steps.cas.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/main' || steps.cas.outputs.cache-matched-key == '')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PURLAY_CACHE_DIR }}
          key: ${{ steps.keys.outputs.key }}

  # The Mac app: Debug for a pull request; Debug and Release on main, which is what keeps a release's build warm.
  macos:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: xcode-27
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CONFIGURATIONS: ${{ github.ref == 'refs/heads/main' && 'Debug Release' || 'Debug' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Xcode, as .github/toolchain.env names it
        run: scripts/ci/select-xcode
      - name: The first xcodebuild, in the background while the caches restore
        run: scripts/ci/warm-xcode start Purlay-macOS
      - id: keys
        run: scripts/ci/cache-keys macos
      - id: cas
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PURLAY_CACHE_DIR }}
          key: ${{ steps.keys.outputs.key }}
          restore-keys: |
            ${{ steps.keys.outputs.this_week }}
            ${{ github.ref != 'refs/heads/main' && steps.keys.outputs.last_week || '' }}
      - name: The first xcodebuild, finished
        run: scripts/ci/warm-xcode wait
      - name: Build the Mac app, and check its transport security and entitlements
        run: scripts/ci/retry-infra scripts/verify macos "$CONFIGURATIONS"
      # Main keeps it; so does a pull request that found nothing at all to restore (main not yet warm, or a new Xcode), so that
      # its next push is warm. GitHub scopes a pull request's cache to that pull request: no other branch can read it.
      - name: Keep the compilation cache
        if: success() && steps.cas.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/main' || steps.cas.outputs.cache-matched-key == '')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PURLAY_CACHE_DIR }}
          key: ${{ steps.keys.outputs.key }}

  # The pinned contract, the generated code and the generator: only when they, or what reads them, change.
  generated:
    needs: changes
    if: needs.changes.outputs.generated == 'true'
    runs-on: xcode-27
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Xcode, as .github/toolchain.env names it
        run: scripts/ci/select-xcode
      - uses: ./.github/actions/contract-bundle
        with:
          token: ${{ github.token }}
      - name: The contract, the generated code and the generator
        run: scripts/verify generated

  # The iOS tests on a simulator: on every push to main, every night and by hand, beside the other lanes, so that main's run (which
  # a release requires, simulator included) ends as early as it can. The simulator boots after the build, not beside it
  # (scripts/verify says why). Its steps are `simulator-pr`'s too.
  simulator:
    needs: changes
    if: needs.changes.outputs.simulator == 'true' && github.event_name != 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps: &simulator-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Xcode, as .github/toolchain.env names it
        run: scripts/ci/select-xcode
      - name: The first xcodebuild, in the background while the caches restore
        run: scripts/ci/warm-xcode start Purlay-iOS
      - name: The simulator .github/toolchain.env names
        run: scripts/ci/simulator-destination
      - id: keys
        run: scripts/ci/cache-keys simulator
      - id: cas
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PURLAY_CACHE_DIR }}
          key: ${{ steps.keys.outputs.key }}
          restore-keys: |
            ${{ steps.keys.outputs.this_week }}
            ${{ github.ref != 'refs/heads/main' && steps.keys.outputs.last_week || '' }}
      - name: The first xcodebuild, finished
        run: scripts/ci/warm-xcode wait
      - name: Build for testing, boot the simulator, test without building
        # Retried once only when the simulator, not a test, failed (scripts/ci/retry-infra).
        run: scripts/ci/retry-infra scripts/verify simulator
      # Main keeps it; so does a pull request that found nothing at all to restore (main not yet warm, or a new Xcode), so that
      # its next push is warm. GitHub scopes a pull request's cache to that pull request: no other branch can read it.
      - name: Keep the compilation cache
        if: success() && steps.cas.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/main' || steps.cas.outputs.cache-matched-key == '')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PURLAY_CACHE_DIR }}
          key: ${{ steps.keys.outputs.key }}

  # The same tests for a pull request that changes the iOS app or the design system (scripts/ci/changes): a check that is not
  # required, started once `verify` has passed, so that it never holds one of the organisation's five macOS runners while a
  # required lane of this or another pull request waits for it.
  simulator-pr:
    name: simulator (pull request)
    needs: [changes, verify]
    if: needs.changes.outputs.simulator == 'true' && github.event_name == 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps: *simulator-steps

  # A red simulator on main opens one issue labelled ci-red-main, or brings the open one up to date: never a second one.
  simulator-red-on-main:
    needs: simulator
    # The simulator's own result: failure() is also true when `changes` failed and the simulator never ran.
    if: always() && needs.simulator.result == 'failure' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: The one issue for a red simulator on main
        run: scripts/ci/red-main-issue simulator
        env:
          GH_TOKEN: ${{ github.token }}

  # The one required check: every lane passed, or was skipped because `changes` said it was not needed. The simulator is not
  # among them: on a pull request it is an early signal that does not block the merge, and a release requires main's full run,
  # the simulator's included (scripts/ci/release-gate).
  verify:
    if: always()
    needs: [changes, security, rules, packages, ios, macos, generated]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: The time each lane took
        run: scripts/ci/summary 180 "Pull request check"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Every lane passed, or was not needed
        run: scripts/ci/verify-needs
        env:
          NEEDS: ${{ toJSON(needs) }}
