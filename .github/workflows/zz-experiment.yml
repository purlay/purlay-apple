# Temporary: measurements for the CI timing change. Removed before merge.
name: Experiment
on:
  pull_request:
    branches: [main]
permissions: {}
defaults:
  run:
    shell: bash
env:
  PURLAY_CACHE_DIR: ${{ github.workspace }}/.cache/compilation
jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci/select-xcode
      - name: invocation costs
        run: |
          t() { local s=$SECONDS; "$@" >/tmp/probe.log 2>&1; echo "$((SECONDS - s)) s  rc=$?  $*" | cut -c1-160; }
          nproc 2>/dev/null || sysctl -n hw.ncpu
          t xcodebuild -version
          t xcodebuild -project Apps/Purlay.xcodeproj -scheme Purlay-macOS -derivedDataPath /tmp/dd1 -clonedSourcePackagesDirPath /tmp/pk -resolvePackageDependencies
          du -sh /tmp/pk
          t xcodebuild -project Apps/Purlay.xcodeproj -scheme Purlay-macOS -derivedDataPath /tmp/dd2 -clonedSourcePackagesDirPath /tmp/pk -resolvePackageDependencies
          t xcodebuild -project Apps/Purlay.xcodeproj -scheme Purlay-macOS -derivedDataPath /tmp/dd3 -clonedSourcePackagesDirPath /tmp/pk2 -resolvePackageDependencies
          t xcodebuild -project Apps/Purlay.xcodeproj -scheme Purlay-macOS -derivedDataPath /tmp/dd3 -clonedSourcePackagesDirPath /tmp/pk2 -resolvePackageDependencies
          t xcodebuild -project Apps/Purlay.xcodeproj -scheme Purlay-macOS -derivedDataPath /tmp/dd3 -clonedSourcePackagesDirPath /tmp/pk2 -showBuildSettings
          t xcodebuild -scheme purlay-apple-Package -destination 'generic/platform=iOS Simulator' -showBuildSettings
          t tar -C /tmp -cf /tmp/pk.tar pk
          ls -la /tmp/pk.tar

  packages-one:
    runs-on: xcode-27
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/contract-bundle
        with:
          token: ${{ github.token }}
      - run: scripts/ci/select-xcode
      - id: keys
        run: scripts/ci/cache-keys packages
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PURLAY_CACHE_DIR }}
          key: ${{ steps.keys.outputs.key }}
          restore-keys: ${{ steps.keys.outputs.this_week }}
      - name: one invocation, then the tests alone again, then each heavy target alone
        run: |
          t() { local s=$SECONDS; "$@" >/tmp/x.log 2>&1; local rc=$?; echo "$((SECONDS - s)) s  rc=$rc  ${*: -3}"; [ $rc = 0 ] || tail -30 /tmp/x.log; }
          c=(-project Apps/Purlay.xcodeproj -scheme Purlay-macOS -testPlan macOS -destination platform=macOS CODE_SIGNING_ALLOWED=NO COMPILATION_CACHE_ENABLE_CACHING=YES "COMPILATION_CACHE_CAS_PATH=$PURLAY_CACHE_DIR" COMPILER_INDEX_STORE_ENABLE=NO -parallel-testing-enabled YES)
          export TEST_RUNNER_PURLAY_SNAPSHOT_DIR=/tmp/snaps
          t xcodebuild "${c[@]}" test
          t xcodebuild "${c[@]}" test-without-building
          for target in PurlayMacUITests PurlayContractTests PurlayKitTests; do t xcodebuild "${c[@]}" test-without-building "-only-testing:$target"; done
          t xcodebuild "${c[@]}" test-without-building -skip-testing:PurlayMacUITests

  ios-now-changed:
    runs-on: xcode-27
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/ci/select-xcode
      - id: keys
        run: scripts/ci/cache-keys ios
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PURLAY_CACHE_DIR }}
          key: ${{ steps.keys.outputs.key }}
          restore-keys: ${{ steps.keys.outputs.this_week }}
      - name: a change in the engine, as a pull request makes it
        run: printf '\nextension Never { public static let experimentMarker = 1 }\n' >> "$(find Sources/PurlayKit/App -name "*.swift" | sort | head -1)"
      - name: today's ios lane
        run: scripts/verify ios

  ios-new-changed:
    runs-on: xcode-27
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/ci/select-xcode
      - id: keys
        run: scripts/ci/cache-keys ios
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PURLAY_CACHE_DIR }}
          key: ${{ steps.keys.outputs.key }}
          restore-keys: ${{ steps.keys.outputs.this_week }}
      - name: a change in the engine, as a pull request makes it
        run: printf '\nextension Never { public static let experimentMarker = 1 }\n' >> "$(find Sources/PurlayKit/App -name "*.swift" | sort | head -1)"
      - name: arm64 only, one derived data folder for both builds
        run: |
          t() { local s=$SECONDS; "$@" >/tmp/x.log 2>&1; local rc=$?; echo "$((SECONDS - s)) s  rc=$rc"; [ $rc = 0 ] || tail -30 /tmp/x.log; grep -c 'SwiftCompile\|CompileSwift ' /tmp/x.log || true; }
          scripts/build-number
          k=(COMPILATION_CACHE_ENABLE_CACHING=YES "COMPILATION_CACHE_CAS_PATH=$PURLAY_CACHE_DIR" COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO ARCHS=arm64)
          t xcodebuild -derivedDataPath /tmp/dd -scheme purlay-apple-Package -destination 'generic/platform=iOS Simulator' "${k[@]}" build
          t xcodebuild -derivedDataPath /tmp/dd -project Apps/Purlay.xcodeproj -scheme Purlay-iOS -destination 'generic/platform=iOS Simulator' "${k[@]}" build
          t xcodebuild -derivedDataPath /tmp/dd2 -project Apps/Purlay.xcodeproj -scheme Purlay-iOS -destination 'generic/platform=iOS Simulator' "${k[@]}" build
