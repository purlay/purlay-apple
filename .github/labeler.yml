# A pull request's platform and area labels, from the paths it changes (actions/labeler). A change to a package both apps use gets both
# platforms. The names are in .github/labels.yml.
ios:
  - changed-files:
      - any-glob-to-any-file: ["Apps/iOS/**", "Sources/FeatureChat/iOS/**", "Config/iOS*.xcconfig", "TestPlans/iOS.xctestplan", "Sources/PurlayKit/**", "Sources/PurlayWords/**", "Sources/PurlayTestSupport/**", "Sources/PurlayContract/**", "Sources/PurlayTokens/**", "Sources/PurlayDesign/**", "Sources/PurlayModuleAPI/**", "Sources/FeatureChat/Shared/**", "Contract/**", "Package.swift", "Config/Shared.xcconfig", "Config/Debug.xcconfig", "Config/Release.xcconfig", "TestPlans/Shared/**"]
macos:
  - changed-files:
      - any-glob-to-any-file: ["Apps/macOS/**", "Sources/PurlayMacUI/**", "Config/macOS.xcconfig", "TestPlans/macOS.xctestplan", "scripts/sign-release", "scripts/release-notes", "scripts/localize", "scripts/dev-signing", "Sources/PurlayKit/**", "Sources/PurlayWords/**", "Sources/PurlayTestSupport/**", "Sources/PurlayContract/**", "Sources/PurlayTokens/**", "Sources/PurlayDesign/**", "Sources/PurlayModuleAPI/**", "Sources/FeatureChat/Shared/**", "Contract/**", "Package.swift", "Config/Shared.xcconfig", "Config/Debug.xcconfig", "Config/Release.xcconfig", "TestPlans/Shared/**"]
kit:
  - changed-files:
      - any-glob-to-any-file: ["Sources/PurlayKit/**", "Sources/PurlayWords/**", "Sources/PurlayTestSupport/**", "Tests/PurlayKitTests/**", "Tests/PurlayTestSupportTests/**", "Tests/PurlayWordsTests/**", "Tests/ContractTests/**"]
contract:
  - changed-files:
      - any-glob-to-any-file: ["Contract/**", "Tools/**", "Sources/PurlayContract/**", "Sources/PurlayTokens/**", "Tests/PurlayContractTests/**", "Tests/PurlayTokensTests/**", "scripts/contract*", "scripts/generate", "scripts/prepare-contract"]
design:
  - changed-files:
      - any-glob-to-any-file: ["Sources/PurlayDesign/**", "Tests/PurlayDesignTests/**", "Design/**", "scripts/icon"]
ui:
  - changed-files:
      - any-glob-to-any-file: ["Sources/PurlayMacUI/**", "Tests/PurlayMacUITests/**", "Sources/FeatureChat/**", "Apps/iOS/App/**", "Apps/macOS/App/**", "Apps/iOS/Tests/**"]
modules:
  - changed-files:
      - any-glob-to-any-file: ["Sources/PurlayModuleAPI/**", "Tests/PurlayModuleAPITests/**"]
build:
  - changed-files:
      - any-glob-to-any-file: ["Package.swift", "Apps/Purlay.xcodeproj/**", "Config/**", "TestPlans/**", "scripts/**", ".githooks/**", "Makefile"]
ci:
  - changed-files:
      - any-glob-to-any-file: [".github/**"]
docs:
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "**/*.md"]
