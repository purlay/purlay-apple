# Every label of the repository. The labels workflow makes the repository's labels exactly these (it creates, updates and removes),
# so a label is added or changed here, in a pull request. Pull requests get their platform and area labels from their paths
# (.github/labeler.yml); type and priority are chosen by a person.

# Where it runs.
- { name: "ios", color: "5319e7", description: "The iPhone and iPad app" }
- { name: "macos", color: "5319e7", description: "The Mac app" }

# Where a change is.
- { name: "kit", color: "1d76db", description: "The engine and API client: PurlayKit and PurlayTestSupport" }
- { name: "contract", color: "1d76db", description: "The pinned contract, the tokens and the generator" }
- { name: "design", color: "1d76db", description: "The design system: PurlayDesign" }
- { name: "ui", color: "1d76db", description: "The screens: PurlayMacUI, FeatureChat and the apps' screens" }
- { name: "modules", color: "1d76db", description: "Feature modules and the registry: PurlayModuleAPI" }
- { name: "build", color: "1d76db", description: "The project, the build settings and the scripts" }
- { name: "ci", color: "1d76db", description: "The workflows" }
- { name: "docs", color: "1d76db", description: "Documentation only" }

# What kind of change or report it is.
- { name: "bug", color: "d73a4a", description: "Something does not work as a document says it should" }
- { name: "feature", color: "0e8a16", description: "New behaviour" }
- { name: "chore", color: "ededed", description: "Maintenance with no change in behaviour" }
- { name: "security", color: "b60205", description: "A security fix or hardening (report vulnerabilities privately: SECURITY.md)" }
- { name: "accessibility", color: "0075ca", description: "VoiceOver, Dynamic Type, contrast, motion or input access" }
- { name: "performance", color: "fbca04", description: "Speed, memory or energy" }

# How soon.
- { name: "p0", color: "b60205", description: "Blocks a release or breaks main: now" }
- { name: "p1", color: "d93f0b", description: "Next, before new work" }
- { name: "p2", color: "fbca04", description: "In turn" }

# Written by automation.
- { name: "dependencies", color: "0366d6", description: "A dependency update (Dependabot)" }
- { name: "broken", color: "b60205", description: "A lane is red on main (the simulator's, which no pull request waits for)" }
- { name: "drift", color: "fef2c0", description: "The server has released past the pinned contract (weekly workflow)" }
